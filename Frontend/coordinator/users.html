<!DOCTYPE html>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">

<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/responsive.css">

</head>


<body>

<div class="dashboard-wrapper">


<aside class="sidebar" id="sidebar">

<div class="sidebar-brand">

<div class="brand-mini">
<i class="bi bi-mortarboard-fill"></i>
</div>

<span>Scholars</span>

</div>


<nav class="sidebar-nav">

<a href="/coordinator/dashboard.html"
   class="nav-item-custom">

<i class="bi bi-grid-1x2"></i>
Dashboard

</a>


<a href="/coordinator/upload-users.html"
   class="nav-item-custom">

<i class="bi bi-upload"></i>
Upload Users

</a>


<a href="/coordinator/users.html"
   class="nav-item-custom active">

<i class="bi bi-people"></i>
Users

</a>


<a href="/coordinator/weekly-reports.html"
   class="nav-item-custom">

<i class="bi bi-file-earmark-bar-graph"></i>
Weekly Reports

</a>

</nav>


<div class="sidebar-bottom">

<button
    class="nav-item-custom logout-btn"
    onclick="logout()">

<i class="bi bi-box-arrow-right"></i>
Logout

</button>

</div>

</aside>


<main class="dashboard-main">


<header class="dashboard-header">

<div>

<button
    class="mobile-menu-btn"
    onclick="toggleSidebar()">

<i class="bi bi-list"></i>

</button>

<span class="header-title">
Users
</span>

</div>


<button
    class="icon-btn"
    id="themeToggle">

<i class="bi bi-moon-stars-fill"></i>

</button>

</header>


<div class="container-fluid dashboard-content">


<div class="page-heading">

<div>

<h2>
College Users
</h2>

<p>
View users imported from the approved whitelist.
</p>

</div>

</div>


<div class="content-card">


<div class="table-responsive">

<table class="table align-middle">

<thead>

<tr>

<th>Name</th>
<th>Email</th>
<th>Role</th>
<th>Department</th>
<th>Year</th>
<th>Status</th>

</tr>

</thead>


<tbody id="usersTable">

<tr>

<td
    colspan="6"
    class="text-center text-muted py-4">

Loading users...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</main>

</div>


<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/coordinator.js"></script>

<script>

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("show");

}


function logout() {

    localStorage.clear();

    window.location.href = "/";

}

</script>

</body>
</html>
