<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Weekly Reports | Scholars</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">

<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/responsive.css">

</head>


<body>

<div class="dashboard-wrapper">


<aside class="sidebar" id="sidebar">

<div class="sidebar-brand">

<div class="brand-mini">
<i class="bi bi-mortarboard-fill"></i>
</div>

<span>Scholars</span>

</div>


<nav class="sidebar-nav">

<a href="/coordinator/dashboard.html"
   class="nav-item-custom">

<i class="bi bi-grid-1x2"></i>
Dashboard

</a>


<a href="/coordinator/upload-users.html"
   class="nav-item-custom">

<i class="bi bi-upload"></i>
Upload Users

</a>


<a href="/coordinator/users.html"
   class="nav-item-custom">

<i class="bi bi-people"></i>
Users

</a>


<a href="/coordinator/weekly-reports.html"
   class="nav-item-custom active">

<i class="bi bi-file-earmark-bar-graph"></i>
Weekly Reports

</a>

</nav>


<div class="sidebar-bottom">

<button
    class="nav-item-custom logout-btn"
    onclick="logout()">

<i class="bi bi-box-arrow-right"></i>
Logout

</button>

</div>

</aside>


<main class="dashboard-main">


<header class="dashboard-header">

<div>

<button
    class="mobile-menu-btn"
    onclick="toggleSidebar()">

<i class="bi bi-list"></i>

</button>

<span class="header-title">
Weekly Reports
</span>

</div>


<button
    class="icon-btn"
    id="themeToggle">

<i class="bi bi-moon-stars-fill"></i>

</button>

</header>


<div class="container-fluid dashboard-content">


<div class="page-heading">

<div>

<h2>
Weekly Reports
</h2>

<p>
Review submitted forms and generate reports.
</p>

</div>

</div>


<div class="content-card">


<div class="row g-3 align-items-end">


<div class="col-12 col-md-5">

<label class="form-label">
Week Start
</label>

<input
    type="date"
    id="weekStart"
    class="form-control">

</div>


<div class="col-12 col-md-5">

<label class="form-label">
Week End
</label>

<input
    type="date"
    id="weekEnd"
    class="form-control">

</div>


<div class="col-12 col-md-2">

<button
    class="btn btn-primary-custom w-100"
    onclick="loadWeeklyForms()">

    View

</button>

</div>

</div>


<div
    id="reportMessage"
    class="alert d-none mt-4">
</div>


<hr class="my-4">


<div class="d-flex
            flex-column
            flex-md-row
            justify-content-between
            gap-2">

<h5>
Submitted Forms
</h5>


<button
    class="btn btn-primary-custom"
    onclick="generateReport()">

<i class="bi bi-file-earmark-plus me-2"></i>

Generate Report

</button>

</div>


<div class="table-responsive mt-3">

<table class="table align-middle">

<thead>

<tr>

<th>Student</th>
<th>Week</th>
<th>Status</th>

</tr>

</thead>


<tbody id="formsTable">

<tr>

<td
    colspan="3"
    class="text-center text-muted py-4">

Select a week to view submissions.

</td>

</tr>

</tbody>

</table>

</div>


</div>

</div>

</main>

</div>


<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/coordinator.js"></script>

<script>

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("show");

}


function logout() {

    localStorage.clear();

    window.location.href = "/";

}


async function loadWeeklyForms() {

    const start =
        document.getElementById(
            "weekStart"
        ).value;

    const end =
        document.getElementById(
            "weekEnd"
        ).value;


    if (!start || !end) {

        showMessage(
            "Please select both dates.",
            "danger"
        );

        return;
    }


    try {

        const data =
            await apiRequest(
                `/coordinator/weekly-reports/${start}/${end}`
            );


        const table =
            document.getElementById(
                "formsTable"
            );


        table.innerHTML = "";


        if (!data.length) {

            table.innerHTML = `

                <tr>

                    <td colspan="3"
                        class="text-center text-muted py-4">

                        No submitted forms found.

                    </td>

                </tr>

            `;

            return;
        }


        data.forEach(form => {

            table.innerHTML += `

                <tr>

                    <td>
                        Student #${form.student_id}
                    </td>

                    <td>
                        ${form.week_start}
                        -
                        ${form.week_end}
                    </td>

                    <td>

                        <span class="status-badge success">
                            ${form.status}
                        </span>

                    </td>

                </tr>

            `;

        });


    } catch(error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


async function generateReport() {

    const start =
        document.getElementById(
            "weekStart"
        ).value;

    const end =
        document.getElementById(
            "weekEnd"
        ).value;


    if (!start || !end) {

        showMessage(
            "Select the report week first.",
            "danger"
        );

        return;
    }


    try {

        const data =
            await apiRequest(
                `/coordinator/weekly-reports/${start}/${end}/generate`,
                {
                    method: "POST"
                }
            );


        showMessage(
            data.message ||
            "Weekly report generated successfully.",
            "success"
        );


    } catch(error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "reportMessage"
        );


    message.textContent = text;

    message.className =
        `alert alert-${type}`;

}

</script>

</body>
</html>
