<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Scholars</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">

<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/auth.css">
<link rel="stylesheet" href="/css/responsive.css">

</head>


<body>

<div class="auth-page">

<button
    class="theme-toggle"
    id="themeToggle">

    <i class="bi bi-moon-stars-fill"></i>

</button>


<div class="container">

<div class="row
            justify-content-center
            align-items-center
            min-vh-100">

<div class="col-12 col-sm-10 col-md-7 col-lg-5">

<div class="auth-card">


<div class="text-center mb-4">

<div class="brand-logo">

<i class="bi bi-key"></i>

</div>

<h1 class="brand-title">
Forgot Password
</h1>

<p class="brand-subtitle">
Enter your registered college email.
</p>

</div>


<form id="forgotForm">

<div class="mb-3">

<label
    class="form-label"
    for="email">

    College Email

</label>

<div class="input-group-custom">

<i class="bi bi-envelope"></i>

<input
    type="email"
    id="email"
    class="form-control"
    placeholder="you@college.edu"
    required>

</div>

</div>


<div
    id="forgotMessage"
    class="alert d-none">
</div>


<button
    class="btn btn-primary-custom w-100">

    Send Reset Link

</button>

</form>


<div class="text-center mt-4">

<a
    href="/"
    class="small-link">

    <i class="bi bi-arrow-left me-1"></i>

    Back to Login

</a>

</div>


</div>

</div>

</div>

</div>

</div>


<script src="/js/api.js"></script>

<script src="/js/auth.js"></script>


<script>

document
    .getElementById("forgotForm")
    .addEventListener(
        "submit",
        async function(e) {

            e.preventDefault();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const message =
                document.getElementById(
                    "forgotMessage"
                );


            try {

                const data =
                    await apiRequest(
                        "/auth/forgot-password",
                        {
                            method: "POST",

                            body:
                                JSON.stringify({
                                    email
                                })
                        }
                    );


                message.textContent =
                    data.message ||
                    "If the account exists, a reset link has been sent.";

                message.className =
                    "alert alert-success";


            } catch(error) {

                message.textContent =
                    error.message;

                message.className =
                    "alert alert-danger";
            }

        }
    );

</script>

</body>
</html>
