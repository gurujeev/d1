<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Weekly Form | Scholars</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">

<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/responsive.css">

</head>


<body>

<div class="dashboard-wrapper">


<aside class="sidebar" id="sidebar">

    <div class="sidebar-brand">

        <div class="brand-mini">
            <i class="bi bi-mortarboard-fill"></i>
        </div>

        <span>Scholars</span>

    </div>


    <nav class="sidebar-nav">

        <a
            href="/student/dashboard.html"
            class="nav-item-custom">

            <i class="bi bi-grid-1x2"></i>
            Dashboard

        </a>


        <a
            href="/student/weekly-form.html"
            class="nav-item-custom active">

            <i class="bi bi-journal-text"></i>
            Weekly Form

        </a>


        <a href="#" class="nav-item-custom">

            <i class="bi bi-calendar-check"></i>
            Attendance

        </a>


        <a href="#" class="nav-item-custom">

            <i class="bi bi-person"></i>
            My Profile

        </a>

    </nav>


    <div class="sidebar-bottom">

        <button
            class="nav-item-custom logout-btn"
            onclick="logout()">

            <i class="bi bi-box-arrow-right"></i>
            Logout

        </button>

    </div>

</aside>


<main class="dashboard-main">


<header class="dashboard-header">

    <div>

        <button
            class="mobile-menu-btn"
            onclick="toggleSidebar()">

            <i class="bi bi-list"></i>

        </button>

        <span class="header-title">
            Weekly Form
        </span>

    </div>


    <div class="header-actions">

        <button
            class="icon-btn"
            id="themeToggle">

            <i class="bi bi-moon-stars-fill"></i>

        </button>

    </div>

</header>


<div class="container-fluid dashboard-content">


<div class="page-heading">

    <div>

        <h2>
            Weekly Academic Form
        </h2>

        <p>
            Record your learning and activities for the week.
        </p>

    </div>

    <span class="status-badge">
        Draft
    </span>

</div>


<div class="content-card">


<form id="weeklyForm">


<div class="row g-3 mb-4">

    <div class="col-12 col-md-6">

        <label class="form-label">
            Week Start
        </label>

        <input
            type="date"
            id="weekStart"
            class="form-control"
            required>

    </div>


    <div class="col-12 col-md-6">

        <label class="form-label">
            Week End
        </label>

        <input
            type="date"
            id="weekEnd"
            class="form-control"
            required>

    </div>

</div>


<div class="mb-4">

    <label class="form-label">
        What did you learn this week?
    </label>

    <textarea
        id="learning"
        class="form-control"
        rows="5"
        placeholder="Describe the concepts, subjects or skills you learned..."
    ></textarea>

</div>


<div class="mb-4">

    <label class="form-label">
        Activities / Projects
    </label>

    <textarea
        id="activities"
        class="form-control"
        rows="5"
        placeholder="Mention projects, practical work, events or other activities..."
    ></textarea>

</div>


<div class="mb-4">

    <label class="form-label">
        Challenges / Support Required
    </label>

    <textarea
        id="challenges"
        class="form-control"
        rows="5"
        placeholder="Describe any challenges or support you need..."
    ></textarea>

</div>


<div
    id="formMessage"
    class="alert d-none">
</div>


<div class="d-flex flex-column flex-sm-row gap-2 justify-content-end">

    <button
        type="button"
        class="btn btn-outline-custom"
        onclick="saveDraft()">

        <i class="bi bi-save me-2"></i>

        Save Draft

    </button>


    <button
        type="submit"
        class="btn btn-primary-custom">

        <i class="bi bi-send me-2"></i>

        Submit Form

    </button>

</div>


</form>

</div>

</div>

</main>

</div>


<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/weekly-form.js"></script>

<script>

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("show");

}


function logout() {

    localStorage.clear();

    window.location.href = "/";

}

</script>

</body>
</html>
